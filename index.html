<title>Vendas Rob's e Bigg's 08/09</title>
<style>
/* Layout: cabeçalho com abas por loja → filtros → big numbers → dia da semana (gráfico + grade de semanas) → hora → mapa dia×hora → abertura/fechamento */
:root{
  --bg:#f7f5f5; --surface:#ffffff; --fg:#231c1d; --muted:#6f6566; --line:#e6dfdf;
  --accent:#b71c25; --accent-rgb:183,28,37; --accent-soft:#f6e1e2;
  --alt:#5a6b7d; --alt-rgb:90,107,125; --good:#1f7a4d; --warn:#b26a00;
  --font:Arial, Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171314; --surface:#221c1d; --fg:#f2ecec; --muted:#a99d9e; --line:#3a3132;
  --accent:#e2464f; --accent-rgb:226,70,79; --accent-soft:#3b2224; --alt:#8fa3b8; --alt-rgb:143,163,184; --good:#4cc08a; --warn:#e9a640; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171314; --surface:#221c1d; --fg:#f2ecec; --muted:#a99d9e; --line:#3a3132;
  --accent:#e2464f; --accent-rgb:226,70,79; --accent-soft:#3b2224; --alt:#8fa3b8; --alt-rgb:143,163,184; --good:#4cc08a; --warn:#e9a640; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.4}
.wrap{max-width:1280px;margin:0 auto;padding:16px 20px 40px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:4px 12px;border-bottom:3px solid var(--accent)}
header img{height:54px;width:auto}
header h1{font-size:22px;margin:0;text-wrap:balance}
header .sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 16px;border-radius:6px;font:inherit;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab:focus-visible,.chip:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding-block:12px}
.fgroup{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fgroup>span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 11px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
select{font:inherit;font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hi .v{color:var(--accent)}
.kpi.lo .v{color:var(--alt)}
.reads{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.read{background:var(--accent-soft);color:var(--fg);border-radius:6px;padding:7px 11px;font-size:13px}
.read b{color:var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.card h2{font-size:15px;margin:0 0 2px}
.card .hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.full{margin-top:14px}
svg text{fill:var(--muted);font-family:var(--font);font-size:11px}
svg .val{fill:var(--fg);font-weight:700}
svg .grid{stroke:var(--line);stroke-width:1}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 7px;text-align:center;font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.lab{text-align:left;color:var(--muted);font-weight:700}
.heat td.c{border:2px solid var(--surface);border-radius:4px}
.cellv{font-weight:700;font-size:12px}
.celld{font-size:10px;opacity:.75}
tr.avg td{border-top:2px solid var(--fg);font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-bottom:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.warnbox{border-left:4px solid var(--warn);background:var(--surface);border-radius:6px;padding:9px 12px;font-size:12.5px;color:var(--fg);margin-top:10px}
.notes ul{margin:6px 0 0;padding-left:18px}
.notes li{margin:4px 0;font-size:13px}
.tag{display:inline-block;font-size:9px;font-weight:700;background:var(--warn);color:#fff;border-radius:3px;padding:0 4px;margin-left:3px;vertical-align:1px}
.wa textarea{width:100%;font:13px/1.45 Arial,Helvetica,sans-serif;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical}
.wabar{display:flex;align-items:center;gap:10px;margin-top:8px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ok{color:var(--good);font-weight:700;font-size:13px}
.top0{margin-top:0}
table.wk td.c,table.wk td.tot{border:1px solid var(--surface);border-radius:4px;padding:3px 5px;line-height:1.2}
table.wk .cellv{font-size:13px}
table.wk .celldev{font-size:10px;font-weight:700;opacity:.85}
table.wk td.empty{color:var(--line);padding:3px}
table.wk th{padding:4px 5px}
table.wk tr.ft td,table.wk tr.avg td{font-size:12px;color:var(--fg);padding:3px 5px}
table.wk td.lab{padding:3px 6px;font-size:12px}
.ctx{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 7px;margin-left:8px;vertical-align:2px}

/* tela inicial compacta: cabe em um print */
.kpi{padding:9px 12px}.kpi .v{font-size:23px;margin-top:2px}.kpi .s{font-size:11.5px}
.reads{gap:6px;margin-top:8px}.read{font-size:12px;padding:5px 9px}
.grid2.first{margin-top:10px}
.grid2.first .card{padding:10px 14px}
.grid2.first .hint{margin-bottom:4px}
.grid2.first td,.grid2.first th{padding:3px 5px}
.wa{display:flex;flex-direction:column}
.wa textarea{flex:1;min-height:180px;font-size:12.5px;line-height:1.35}
header{padding-block:0 8px}header img{height:44px}header h1{font-size:20px}
.filters{padding-block:8px}
.storebar{font-size:18px;font-weight:700;color:var(--accent);margin:0 0 8px}.storebar span{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2,.cmp{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:21px}.wrap{padding:12px 16px 32px}.tabs{margin-left:0}}
</style>

function ranges(hs){const r=[];for(const h of hs){const l=r[r.length-1];if(l&&h===l[1]+1)l[1]=h;else r.push([h,h])}return r.map(([a,b])=>a===b?hl(a):`${hl(a)} a ${hl(b)}`).join(' e ')}
function ctx(key){const S=D.stores[key];const p=st.pdv!=='all'&&st.tab===key?' · '+S.pdvs[st.pdv]:'';const g={all:'',0:' · presencial',1:' · online'}[st.pay];return `<span class="ctx">${NAMES[key]} · ${PER[st.per]}${p}${g}</span>`}
function waText(key,A){
  const valid=A.wd.filter(w=>w.n);if(!valid.length)return 'Sem vendas no filtro selecionado.';
  const best=valid.reduce((a,b)=>b.avg>a.avg?b:a),worst=valid.reduce((a,b)=>b.avg<a.avg?b:a);

  const peak=A.hr.reduce((a,b)=>b.v>a.v?b:a);
  const ord=[...A.hr].sort((a,b)=>b.v-a.v);let c=0,top=[];for(const h of ord){if(c>=.8*A.V)break;c+=h.v;top.push(h.h)}top.sort((a,b)=>a-b);
  const sh=(lo,hi)=>A.hr.filter(h=>h.h>=lo&&h.h<hi).reduce((s,h)=>s+h.v,0)/(A.V||1);
  const vs=x=>(x>=0?'+':'')+pct(x);

  L.push(`📆 *Média por dia da semana*`);
  A.wd.forEach(w=>{if(w.n)L.push(`${w.w===best.w?'🔝':w.w===worst.w?'🔻':'▫️'} ${DOW[w.w]}: ${brl(w.avg)} (${vs(w.avg/avg-1)})`)});
  L.push('',`⏰ *Venda por hora*`,`🔥 Pico: *${hl(peak.h)}* (${pct(peak.v/(A.V||1))} do dia)`,`🎯 80% da venda: ${ranges(top)}`,`🌅 Antes das 19h: ${pct(sh(0,19))}`,`🌙 Depois de 00h: ${pct(sh(24,99))}`,'');
  const fl=[];A.wd.forEach(w=>{const f=median(w.ids.map(i=>A.first[i]).filter(x=>x!=null)),l=median(w.ids.map(i=>A.last[i]).filter(x=>x!=null));if(f!=null)fl.push(`${DOW[w.w]}: ${hm(f)} → ${hm(l)}`)});

}

function grouped(labels,a,b,fmt){
  const W=Math.max(520,labels.length*64),H=240,L=58,R=10,Tp=16,Bm=28;const mx=niceMax(Math.max(...a,...b)*1.08);const pw=W-L-R,ph=H-Tp-Bm,bw=pw/labels.length;const y=v=>Tp+ph-(v/mx)*ph;

  labels.forEach((lb,i)=>{const x=L+i*bw+bw*.12,w=bw*.36;
    s+=`<rect x="${x}" y="${y(a[i])}" width="${w}" height="${Tp+ph-y(a[i])}" rx="2" fill="var(--accent)"><title>Rob's ${lb}: ${fmt(a[i])}</title></rect>`;
    s+=`<rect x="${x+w+bw*.04}" y="${y(b[i])}" width="${w}" height="${Tp+ph-y(b[i])}" rx="2" fill="var(--alt)"><title>Bigg's ${lb}: ${fmt(b[i])}</title></rect>`;
    s+=`<text x="${L+i*bw+bw/2}" y="${H-Bm+16}" text-anchor="middle">${lb}</text>`});
  return s+'</svg></div>';
}

/* ---------- wiring ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===st.tab));
  const pg=document.getElementById('f-pdv');
  if(st.tab==='cmp'){pg.hidden=true}else{const P=D.stores[st.tab].pdvs;pg.hidden=P.length<2;const s=document.getElementById('pdv');
    s.innerHTML='<option value="all">Todos</option>'+P.map((p,i)=>`<option value="${i}">${p}</option>`).join('');
    if(st.pdv!=='all'&&+st.pdv>=P.length)st.pdv='all';s.value=st.pdv}
  for(const[g,k]of[['f-per','per']])document.querySelectorAll(`#${g} .chip`).forEach(c=>c.setAttribute('aria-pressed',c.dataset.v==st[k]));
  document.getElementById('view').innerHTML=st.tab==='cmp'?cmpView():storeView(st.tab);
  try{localStorage.setItem('rv-state',JSON.stringify(st))}catch(e){}
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{st.tab=t.dataset.tab;if(st.tab!=='biggs')st.pdv='all';render()});
for(const[g,k]of[['f-per','per']])document.querySelectorAll(`#${g} .chip`).forEach(c=>c.onclick=()=>{st[k]=c.dataset.v;render()});
document.getElementById('pdv').onchange=e=>{st.pdv=e.target.value;render()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
render();
</script>

</body></html>
